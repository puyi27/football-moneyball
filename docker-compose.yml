version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: fb_postgres
    environment:
      - POSTGRES_USER=moneyball
      - POSTGRES_PASSWORD=scouting_admin
      - POSTGRES_DB=football_db
    ports:
      - "5432:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    command: postgres -c shared_buffers=512MB -c work_mem=16MB
    networks:
      - moneyball_net

  jupyter_spark:
    image: jupyter/pyspark-notebook:spark-3.5.0
    container_name: fb_jupyter
    depends_on:
      - postgres
    environment:
      - JUPYTER_ENABLE_LAB=yes
      - GRANT_SUDO=yes
    user: root
    ports:
      - "8888:8888"
      - "8501:8501"
      - "4040:4040" 
    volumes:
      - .:/home/jovyan/work
    command: >
      bash -c "pip install -r /home/jovyan/work/requirements.txt && 
      start-notebook.sh --NotebookApp.token='moneyball' --NotebookApp.password=''"
    networks:
      - moneyball_net

networks:
  moneyball_net:
    driver: bridge